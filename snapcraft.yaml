name: xenia-canary
base: core24
version: '8a49c03'
summary: Xbox 360 research emulator 
description: |
  Xenia Canary is an experimental fork of the Xbox 360 emulator, Xenia.
  Learn more at https://xenia.jp/
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  xenia-canary:
    command: bin/xenia-canary.sh
    desktop: share/applications/org.xenia.Xenia-canary.desktop
    plugs:
      - x11
      - opengl
      - network
      - home
      - removable-media
      - audio-playback
      - joystick
      - bluez
      - screen-inhibit-control
    environment:
      HOME: $SNAP_USER_COMMON
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/lib:$SNAP/lib64:$LD_LIBRARY_PATH

parts:
  xenia-bin:
    plugin: nil
    source: https://github.com/xenia-canary/xenia-canary/releases/latest/download/xenia_canary_linux.AppImage
    source-type: file
    stage-packages:
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libasound2t64
      - libgbm1
      - libwayland-client0
      - libfontconfig1
      - libfribidi0
      - libharfbuzz0b
      - libgtk-3-0
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libSDL2-2.0
      - libpulse0
      - libxcomposite1
      - libxcursor1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libxss1
      - libatk-bridge2.0-0
    override-build: |
      chmod +x $CRAFT_PART_SRC/xenia_canary_linux.AppImage
      $CRAFT_PART_SRC/xenia_canary_linux.AppImage --appimage-extract
      
      mkdir -p $CRAFT_PART_INSTALL/bin
      mkdir -p $CRAFT_PART_INSTALL/lib
      mkdir -p $CRAFT_PART_INSTALL/share/applications/
      mkdir -p $CRAFT_PART_INSTALL/share/icons/

      cp squashfs-root/usr/bin/xenia_canary $CRAFT_PART_INSTALL/bin/xenia_canary
      cp -r squashfs-root/usr/lib/* $CRAFT_PART_INSTALL/lib/
      cp -r squashfs-root/usr/share/* $CRAFT_PART_INSTALL/share/
      cp $CRAFT_PROJECT_DIR/org.xenia.Xenia-canary.desktop $CRAFT_PART_INSTALL/share/applications/

      cp $CRAFT_PROJECT_DIR/xenia-canary.sh $CRAFT_PART_INSTALL/bin/
      chmod +x $CRAFT_PART_INSTALL/bin/xenia-canary.sh

    prime:
      - bin/*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/*
      - share/*
