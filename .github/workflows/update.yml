name: Updates from upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # to trigger job manually

jobs:
  update-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest tag
        id: get_tag
        run: |
          # get latest release
          RELEASE=$(curl -s https://api.github.com/repos/xenia-canary/xenia-canary/releases/latest | jq -r .tag_name)
          echo "tag=$RELEASE" >> $GITHUB_OUTPUT

      - name: Update version in snapcraft.yaml
        run: |
          # update version line
          sed -i "s/^version: .*/version: '${{ steps.get_tag.outputs.tag }}'/" snapcraft.yaml

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapcraft.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bump version to ${{ steps.get_tag.outputs.tag }}" && git push)
