name: Updates from upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # to trigger job manually

jobs:
  update-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest tag
        id: get_tag
        run: |
          # get latest release
          RELEASE=$(curl -s https://api.github.com/repos/xenia-canary/xenia-canary/releases/latest | jq -r .tag_name)
          echo "tag=$RELEASE" >> $GITHUB_OUTPUT

      - name: Update version in snapcraft.yaml
        run: |
          # update version line
          sed -i "s/^version: .*/version: '${{ steps.get_tag.outputs.tag }}'/" snapcraft.yaml

      - name: Commit and push
        run: |
          # set author to actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapcraft.yaml # add the one file we change
          # check for any commits
          if git diff --quiet && git diff --staged --quiet; then
            echo "Ehh, nothin's new. Peace out."
            exit 1 # fails fast
          fi
          # else do the commit
          git commit -m "Bump version to ${{ steps.get_tag.outputs.tag }}"
          git push

      - name: Verify commit
        run: |
          # this loop is for verifying commit sync
          # with remote cuz otherwise the next job won't sync
          # would rather not use the same yaml to inherit same local commits
          # or attempt and sync them honestly

          # also long for loop warning
          local=$(git rev-parse HEAD)
          echo "Verifying $local"
          
          for i in {1..5}; do
            git fetch origin --quiet
            remote=$(git rev-parse @{u})
            
            if [ "$local" == "$remote" ]; then
              echo "Commit is on remote, building now."
              exit 0
            fi
            
            echo "Commit isn't on remote yet. Trying again..."
            sleep 5
          done

          echo "Error: Remote took too long to sync. Check for any problems and try again."
          exit 1
  build-after-publish:
    name: Build snap
    needs: [update-snap]
    uses: ./.github/workflows/build.yml
    secrets: inherit
